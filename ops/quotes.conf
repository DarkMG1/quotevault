# Install in /etc/nginx/sites-available/quotes.conf after staging a release.
# The deployment parent must be owned by the deployment user, never world-writable.
server {
    listen 80;
    server_name quotes.darkmg1.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quotes.darkmg1.dev;
    root /home/dark/quotevault/current/dist;
    index index.html;

    ssl_certificate /etc/cloudflare/server.pem;
    ssl_certificate_key /etc/cloudflare/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/qv.app-access.log;
    error_log /var/log/nginx/qv.app-error.log;

    # Define once at server scope: location-level add_header would mask these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag none always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $qv_cache_control always;

    # Hash navigation does not need a fallback for missing files.
    location / { try_files $uri $uri/ =404; }
    location /assets/ { try_files $uri =404; }
    location ~ /\. { deny all; }
}
