# Install in /etc/nginx/conf.d/quotevault-cache.conf (http context).
# Cache successful content-hashed assets only. Error responses must revalidate.
map "$status:$uri" $qv_cache_control {
    default "no-cache";
    ~^200:/assets/ "public, max-age=31536000, immutable";
    ~^304:/assets/ "public, max-age=31536000, immutable";
}
